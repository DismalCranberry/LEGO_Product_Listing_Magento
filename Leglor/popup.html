<!-- popup.html — MV3 extension UI for Dormant LEGO Content Scraper -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LEGO Scraper</title>
    <style>
        body {
            font-family: monospace;
            margin: 10px;
            width: 380px;
            background: #fafafa;
            color: #222;
        }

        textarea, input {
            width: 100%;
            box-sizing: border-box;
            font-family: monospace;
        }

        textarea {
            height: 60px;
            resize: vertical;
        }

        .start-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            margin-top: 8px;
        }

        .start-grid button {
            width: 100%;
            margin: 0;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 2px;
        }

        .controls button {
            margin-right: 0;
        }

        #status {
            background: #111;
            color: #0f0;
            padding: 5px;
            height: 180px;
            overflow-y: auto;
            font-size: 11px;
            margin-top: 8px;
            white-space: pre-wrap;
        }

        button {
            padding: 6px 10px;
            margin-right: 6px;
            margin-top: 8px;
            font-family: monospace;
        }
    </style>
</head>
<body>
<h3>Dormant LEGO Scraper</h3>

<label>Product IDs (comma or space separated):</label>
<label for="ids"></label><textarea id="ids" placeholder="1234, 5678, 9012"></textarea>

<div class="start-grid">
    <button id="start-all">Get Data + Images</button>
    <button id="start-data">Get Data Only</button>
    <button id="start-images">Get Images Only</button>
</div>

<div class="controls">
    <button id="stop" disabled>Stop</button>
    <button id="save" disabled>Save XML</button>
    <button id="clear">Clear Input</button>
</div>

<p style="font: 11px/1.35 system-ui, sans-serif; color: #555; margin: 7px 0 0;">
    Runs continue in the background after this panel is closed. Reopen it to view progress or stop the run.
</p>

<div id="status"></div>

<script src="popup.js"></script>
</body>
</html>
